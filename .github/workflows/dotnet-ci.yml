name: .NET CI Pipeline

on:
  push:
    branches: [ main ]      # Runs when you push to main
  pull_request:
    branches: [ main ]      # Runs when you open a PR to main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # This spins up a real SQL Server in the cloud runner
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: Password123!
          ACCEPT_EULA: Y
        ports:
          - 1433:1433

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # ... setup and restore steps ...

    - name: Run Unit Tests
      run: dotnet test --no-build --configuration Release
      env:
        # Override the connection string to point to the container
        ConnectionStrings__DefaultConnection: "Server=localhost;Database=TestDb;User Id=sa;Password=Password123!;Encrypt=False;"
