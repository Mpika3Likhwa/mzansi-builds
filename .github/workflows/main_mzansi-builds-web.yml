name: Build and deploy ASP.Net Core app to Azure Web App - mzansi-builds-web

on:
  push:
    branches:
      - main
    paths:
      - 'src/mzansi-builds-web/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: dotnet restore
        run: dotnet restore src/mzansi-builds-web/mzansi-builds-web.csproj

      - name: Build with dotnet
        run: dotnet build src/mzansi-builds-web/mzansi-builds-web.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish src/mzansi-builds-web/mzansi-builds-web.csproj -c Release -o "${{env.DOTNET_ROOT}}/mzansi-web-publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-bundle
          path: ${{env.DOTNET_ROOT}}/mzansi-web-publish

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app-bundle
          path: ./publish-dir
      
      # NO LOGIN STEP NEEDED - The Publish Profile handles it below
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mzansi-builds-web'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish-dir
