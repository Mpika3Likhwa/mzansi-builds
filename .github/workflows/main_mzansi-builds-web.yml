# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - mzansi-builds-web

on:
  push:
    branches:
      - main
    paths:
      - 'src/mzansi-builds-web/**' # Optional: only triggers when web files change
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # 1. Restore specific project
      - name: dotnet restore
        run: dotnet restore src/mzansi-builds-web/mzansi-builds-web.csproj

      # 2. Build specific project
      - name: Build with dotnet
        run: dotnet build src/mzansi-builds-web/mzansi-builds-web.csproj --configuration Release --no-restore

      # 3. Publish to a clean output directory
      - name: dotnet publish
        run: dotnet publish src/mzansi-builds-web/mzansi-builds-web.csproj -c Release -o "${{env.DOTNET_ROOT}}/web-output"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: web-app-artifact
          path: ${{env.DOTNET_ROOT}}/web-output

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: web-app-artifact
          path: ./publish-web # Consistent local path for deployment
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2D7231209F474DBFAC6AE4AB88446B1F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EAF0B954E41C4232A78DE7E8DA963860 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_71BFC795680F42A7AC697F4FBDCA5351 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mzansi-builds-web'
          slot-name: 'Production'
          package: ./publish-web
