name: Build and deploy ASP.Net Core app to Azure Web App - mzansi-builds-web

on:
  push:
    branches:
      - main
    paths:
      - 'src/mzansi-builds-web/**' # Only triggers when web project changes
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # 1. Restore specific project
      - name: dotnet restore
        run: dotnet restore src/mzansi-builds-web/mzansi-builds-web.csproj

      # 2. Build specific project
      - name: Build with dotnet
        run: dotnet build src/mzansi-builds-web/mzansi-builds-web.csproj --configuration Release --no-restore

      # 3. Publish to a specific subfolder in the runner
      - name: dotnet publish
        run: dotnet publish src/mzansi-builds-web/mzansi-builds-web.csproj -c Release -o "${{env.DOTNET_ROOT}}/mzansi-web-publish"

      # 4. Upload the published files
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: web-app-bundle
          path: ${{env.DOTNET_ROOT}}/mzansi-web-publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: web-app-bundle
          path: ./publish-dir # Downloads files into this folder
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0089450FB9174C81B9CECDA7E9DB2142 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4E5451471EB4E088D7E2CD944D84FCB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C2988728B454452783D019569832ECBD }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mzansi-builds-web'
          slot-name: 'Production'
          package: ./publish-dir # Points exactly to the downloaded files
